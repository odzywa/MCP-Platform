{% from "macros.html" import select_options -%}
{% if fields %}<div class="grid">{% for f in fields %}<label>{{ f.label }}{% if f.required %} *{% endif %}{% if f.enum %}<select name="{{ f.name }}">{{ select_options(f.enum, str(f.value)) }}</select>{% elif f.type == "boolean" %}<select name="{{ f.name }}">{{ select_options(["true", "false"], "true" if f.value else "false") }}</select>{% elif f.type == "integer" %}<input type="number" name="{{ f.name }}" value="{{ f.value }}">{% elif f.type in ["array", "object"] %}<textarea name="{{ f.name }}">{{ json.dumps(f.value, ensure_ascii=false) }}</textarea>{% else %}<input name="{{ f.name }}" value="{{ f.value }}">{% endif %}</label>{% endfor %}</div>{% else %}<p class="muted">This schema does not declare configurable fields.</p>{% endif %}
